version: '3.8'

networks:
  task-network:
    driver: bridge

volumes:
  mongo-data:

services:
  # --- API TIER ---
  api:
    image: sid0802/day-36-task-manager:v1.0
    build: .
    ports:
      - "3000:3000"
    networks:
      - task-network
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@database:27017/tasks?authSource=admin
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure

  # --- DATABASE TIER ---
  database:
    image: mongo:6.0
    networks:
      - task-network
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

